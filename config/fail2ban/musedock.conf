# MuseDock Fail2Ban jails
# Installed by install.sh / update.sh — do not edit manually

# Bloqueos crecientes para los que insisten: cada reincidencia dobla el tiempo
# (2 h → 4 h → 8 h …) hasta 1 semana, contando las reincidencias en TODAS las jaulas.
# Necesita recordar los bloqueos (dbpurgeage = 30d en fail2ban.d/musedock.conf).
# La lista blanca (ignoreip) va en jail.local, que se lee después y no se pisa.
[DEFAULT]
bantime.increment = true
bantime.factor = 1
bantime.maxtime = 1w
bantime.overalljails = true

[musedock-panel]
enabled  = true
filter   = musedock-panel
logpath  = /var/log/musedock-panel-auth.log
port     = 8444
maxretry = 5
findtime = 600
bantime  = 3600
action   = iptables-multiport[name=musedock-panel, port="8444", protocol=tcp]

[musedock-portal]
enabled  = true
filter   = musedock-portal
logpath  = /var/log/musedock-portal-auth.log
port     = 8446
maxretry = 10
findtime = 600
bantime  = 1800
action   = iptables-multiport[name=musedock-portal, port="8446", protocol=tcp]

[musedock-wordpress]
enabled  = true
filter   = musedock-wordpress
logpath  = /var/log/caddy/hosting-access.log
port     = http,https
maxretry = 8
findtime = 300
bantime  = 7200
# iptables corta a quien conecta directo; musedock-caddy-ban, a quien llega por Cloudflare.
# El bloqueo en Caddy se quita cuando fail2ban desbloquea (actionunban); 1 semana es
# solo el tope por si fail2ban se parara (los bloqueos crecen hasta 1 semana).
action   = iptables-multiport[name=musedock-wordpress, port="80,443", protocol=tcp]
           musedock-caddy-ban[bantime=604800]

# Ataques lentos a WordPress: más de 30 intentos fallidos en 24 h (una IP que prueba
# unas pocas veces por hora nunca llegaba al límite de 8 en 5 min). Mismo filtro y acciones.
[musedock-wordpress-slow]
enabled  = true
filter   = musedock-wordpress
logpath  = /var/log/caddy/hosting-access.log
port     = http,https
maxretry = 30
findtime = 86400
bantime  = 86400
action   = iptables-multiport[name=musedock-wp-slow, port="80,443", protocol=tcp]
           musedock-caddy-ban[bantime=604800]
