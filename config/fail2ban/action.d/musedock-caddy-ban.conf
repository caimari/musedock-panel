# MuseDock Panel: banea en Caddy por la IP real del visitante (cabecera Cf-Connecting-Ip).
# Con el proxy de Cloudflare las conexiones llegan desde IPs de Cloudflare, así que el ban
# de iptables no corta nada; esta acción mete la IP en una ruta de Caddy que responde 403.
# Va junto a iptables-multiport (que sigue cortando a quien conecta directo).

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/bin/php /opt/musedock-panel/bin/wp-harden.php ban <ip> <bantime>
actionunban = /usr/bin/php /opt/musedock-panel/bin/wp-harden.php unban <ip>

[Init]
bantime = 7200
