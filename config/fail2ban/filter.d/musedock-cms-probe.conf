# Fail2Ban: escáneres en MuseDock CMS — rutas que solo piden los atacantes
# (/.env, /.git/, /config/secrets/, *.tfvars, wp-login.php en sitios sin WordPress,
# *.php sueltos como /uuu.php...). El CMS responde 404 al instante y lo anota en
# storage/logs/security-events.log. Las imágenes de antiguos WordPress
# (/wp-content/uploads/) no se anotan, para no banear a lectores de páginas viejas.
#
#   2026-10-16T23:10:00+00:00 musedock-cms event=probe ip=203.0.113.7 host=musedock.com path=/.env

[Definition]
failregex = ^ musedock-cms event=probe ip=<HOST> host=\S+ path=\S+$
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S(?:[+-]\d\d:\d\d)?
