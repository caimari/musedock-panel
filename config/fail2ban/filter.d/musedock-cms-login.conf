# Fail2Ban: logins fallidos en MuseDock CMS (superadmin, admins de tenant, clientes y 2FA).
#
# El CMS escribe una línea por intento fallido en storage/logs/security-events.log
# (core/Security/SecurityEventLog.php). La IP ya viene resuelta y validada por el CMS:
# solo usa Cf-Connecting-Ip si la conexión llega de Cloudflare, y nunca registra IPs de
# Cloudflare, privadas ni de loopback. No contiene emails ni contraseñas.
#
#   2026-10-16T23:10:00+00:00 musedock-cms event=login_failed ip=203.0.113.7 host=musedock.com path=/musedock/login

[Definition]
failregex = ^ musedock-cms event=(?:login_failed|twofa_failed) ip=<HOST> host=\S+ path=\S+$
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S(?:[+-]\d\d:\d\d)?
