# Fail2Ban filter for WordPress brute force via Caddy JSON access logs
# Matches POST requests to wp-login.php and xmlrpc.php
#
# SEGURIDAD: la cabecera Cf-Connecting-Ip SOLO se cree si la conexion (remote_ip) viene de
# una IP de Cloudflare (_cf). Si no, cualquiera podria conectar directo al servidor con
# "Cf-Connecting-Ip: <IP de otro>" y hacer que se banee a un inocente (o librarse el mismo).
# Conexiones que no son de Cloudflare: se usa client_ip e se ignora esa cabecera.
# Si Cloudflare publica rangos nuevos hay que ampliar _cf (https://www.cloudflare.com/ips/).

[Definition]
_cf = (?:173\.245\.(?:4[89]|5\d|6[0-3])\.|103\.21\.24[4-7]\.|103\.22\.20[0-3]\.|103\.31\.[4-7]\.|141\.101\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.|108\.162\.(?:19[2-9]|2\d\d)\.|190\.93\.(?:24\d|25[0-5])\.|188\.114\.(?:9[6-9]|10\d|11[01])\.|197\.234\.24[0-3]\.|198\.41\.(?:1[2-9]\d|2\d\d)\.|162\.15[89]\.|104\.(?:1[6-9]|2[0-7])\.|172\.(?:6[4-9]|7[01])\.|131\.0\.7[2-5]\.|2400:cb00:|2606:4700:|2803:f800:|2405:b500:|2405:8100:|2a06:98c[0-7]:|2c0f:f248:)

# Conexion desde Cloudflare: IP real en Cf-Connecting-Ip
failregex = ^\s*\{.*?"request":\{"remote_ip":"%(_cf)s[^"]*".*?"method":"POST".*?"uri":"(?:/wp-login\.php|[^"]*/xmlrpc\.php)[^"]*".*?"Cf-Connecting-Ip":\["<HOST>"
# Conexion directa (no Cloudflare): client_ip; la cabecera Cf-Connecting-Ip se ignora
            ^\s*\{.*?"request":\{"remote_ip":"(?!%(_cf)s)[^"]*","remote_port":"[^"]*","client_ip":"<HOST>".*?"method":"POST".*?"uri":"(?:/wp-login\.php|[^"]*/xmlrpc\.php)

# Ignore known legitimate WordPress.com/Jetpack XML-RPC traffic so we
# don't ban shared WordPress.com IPs used by Jetpack services.
# This only ignores xmlrpc.php requests (NOT wp-login.php).
ignoreregex = ^\s*\{.*"method"\s*:\s*"POST".*"uri"\s*:\s*".*/xmlrpc\.php.*"User-Agent"\s*:\s*\[\s*"(Jetpack by WordPress\.com|WordPress\.com; https://wordpress\.com|jetmon/1\.0 \(Jetpack Site Uptime Monitor by WordPress\.com\)|Jetpack\/).*$
              ^\s*\{.*"User-Agent"\s*:\s*\[\s*"(Jetpack by WordPress\.com|WordPress\.com; https://wordpress\.com|jetmon/1\.0 \(Jetpack Site Uptime Monitor by WordPress\.com\)|Jetpack\/).*".*"method"\s*:\s*"POST".*"uri"\s*:\s*".*/xmlrpc\.php.*$

datepattern = "ts"\s*:\s*{EPOCH}
