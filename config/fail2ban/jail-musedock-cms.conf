# MuseDock CMS — jaulas de fail2ban
# Instalado por update.sh en /etc/fail2ban/jail.d/musedock-cms.conf SOLO si el CMS está en
# este servidor (si no, fail2ban no encontraría el fichero y no cargaría la jaula).
# __CMS_SECURITY_LOG__ lo sustituye update.sh por la ruta real del registro del CMS.
# Los bloqueos crecen con las reincidencias (bantime.increment en jail.d/musedock.conf).
# iptables corta a quien conecta directo; musedock-caddy-ban, a quien llega por Cloudflare.

# Logins fallidos (superadmin, admins de tenant, clientes, 2FA). El CMS ya frena a cada
# cuenta con su propio límite; esto corta a la IP que prueba muchas contraseñas.
[musedock-cms-login]
enabled  = true
backend  = auto
filter   = musedock-cms-login
logpath  = __CMS_SECURITY_LOG__
port     = http,https
maxretry = 8
findtime = 600
bantime  = 3600
action   = iptables-multiport[name=musedock-cms-login, port="80,443", protocol=tcp]
           musedock-caddy-ban[bantime=604800]

# Escáneres: rutas que ningún visitante normal pide (/.env, /.git, *.php sueltos...)
[musedock-cms-probe]
enabled  = true
backend  = auto
filter   = musedock-cms-probe
logpath  = __CMS_SECURITY_LOG__
port     = http,https
maxretry = 10
findtime = 300
bantime  = 86400
action   = iptables-multiport[name=musedock-cms-probe, port="80,443", protocol=tcp]
           musedock-caddy-ban[bantime=604800]
